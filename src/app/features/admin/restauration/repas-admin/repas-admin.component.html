<section class="dashboard-page">
  <div class="header">
    <h1>Meal Management</h1>
    <button class="add-btn" (click)="openForm()">+ Add Meal</button>
  </div>

  <input [(ngModel)]="searchText" placeholder="Search meals..." class="search-input" />

  <div *ngIf="showForm" class="form-card">
    <h3>{{ isEdit ? 'Edit' : 'Add' }} Meal</h3>

    <input [(ngModel)]="form.nom" placeholder="Name" />
    <input [(ngModel)]="form.prix" type="number" placeholder="Price" />

    <!-- Image actuelle si edit -->
    <div *ngIf="isEdit && form.image && !imagePreview" style="margin:8px 0">
      <label>Current image:</label><br>
      <img
        [src]="isCloudinaryUrl(form.image) ? form.image : 'assets/images/default-food.jpg'"
        style="width:80px; height:80px; object-fit:cover; border-radius:8px; margin-top:6px;"
      />
    </div>

    <!-- Preview nouvelle image -->
    <div *ngIf="imagePreview" style="margin:8px 0">
      <label>New image preview:</label><br>
      <img [src]="imagePreview" style="width:80px; height:80px; object-fit:cover; border-radius:8px; margin-top:6px;" />
    </div>

    <div style="margin:10px 0">
      <label>{{ isEdit ? 'Change image (optional)' : 'Image *' }}</label><br>
      <input type="file" accept="image/*" (change)="onFileSelected($event)" style="margin-top:6px;" />
    </div>

    <div class="form-actions">
      <button class="btn save" (click)="save()">Save</button>
      <button class="btn cancel" (click)="cancel()">Cancel</button>
    </div>
  </div>

  <div class="table-wrapper" *ngIf="repasList.length > 0">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Image</th>
          <th>Name</th>
          <th>Price</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of filteredRepas">
          <td>{{ r.id }}</td>
          <td>
            <img
              [src]="isCloudinaryUrl(r.image) ? r.image : 'assets/images/default-food.jpg'"
              alt="{{ r.nom }}"
              style="width:60px; height:60px; object-fit:cover; border-radius:8px;"
            />
          </td>
          <td>{{ r.nom }}</td>
          <td>{{ r.prix | currency }}</td>
          <td class="actions">
            <button class="btn edit" (click)="edit(r)">Edit</button>
            <button class="btn delete" (click)="delete(r.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <h2>Orders</h2>
<div class="table-wrapper" *ngIf="commandesList.length > 0">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Date</th>
        <th>Total Amount</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of commandesList">
        <td>{{ c.id }}</td>
        <td>{{ c.dateCommande | date:'short' }}</td>
        <td>{{ c.montantTotal | currency }}</td>
        <td>
          <span [ngClass]="{
            'statut-attente': c.statut === 'EN_ATTENTE',
            'statut-confirmee': c.statut === 'CONFIRMEE',
            'statut-preparation': c.statut === 'EN_PREPARATION',
            'statut-livree': c.statut === 'LIVREE',
            'statut-annulee': c.statut === 'ANNULEE'
          }">{{ c.statut }}</span>
        </td>
        <td class="actions">
          <button class="btn toggle"
            *ngIf="c.statut === 'EN_ATTENTE'"
            (click)="updateCommandeStatus(c, 'CONFIRMEE')">
            Confirm
          </button>
          <button class="btn toggle"
            *ngIf="c.statut === 'CONFIRMEE'"
            (click)="updateCommandeStatus(c, 'EN_PREPARATION')">
            Prepare
          </button>
          <button class="btn toggle"
            *ngIf="c.statut === 'EN_PREPARATION'"
            (click)="updateCommandeStatus(c, 'LIVREE')">
            Mark Delivered
          </button>
          <button class="btn delete"
            *ngIf="c.statut !== 'LIVREE'"
            (click)="updateCommandeStatus(c, 'ANNULEE')">
            Cancel
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</section>
