<section class="products-section">
  <div class="container">
    <h2 class="section-title">Our Products</h2>

    <p class="section-description">
      Discover our selection of available products.
    </p>

    <div class="filters-panel">
      <div class="search-box">
        <input
          type="text"
          [(ngModel)]="searchTerm"
          (ngModelChange)="onFilterChange()"
          placeholder="Search by name, category or description"
          class="search-input"
          maxlength="50"
          autocomplete="off"
        />
      </div>

      <div class="filters-grid">
        <div class="filter-group">
          <label>Category</label>
          <select
            [(ngModel)]="selectedCategory"
            (ngModelChange)="onFilterChange()"
          >
            <option value="">All categories</option>
            <option *ngFor="let category of categories" [value]="category">
              {{ category }}
            </option>
          </select>
        </div>

        <div class="filter-group">
          <label>Min price</label>
          <input
            type="number"
            [(ngModel)]="minPrice"
            (ngModelChange)="onFilterChange()"
            placeholder="0"
            min="0"
          />
        </div>

        <div class="filter-group">
          <label>Max price</label>
          <input
            type="number"
            [(ngModel)]="maxPrice"
            (ngModelChange)="onFilterChange()"
            placeholder="500"
            min="0"
          />
        </div>

        <div class="filter-group">
          <label>Sort by</label>
          <select
            [(ngModel)]="sortOption"
            (ngModelChange)="onFilterChange()"
          >
            <option value="">Default</option>
            <option value="priceAsc">Price: low to high</option>
            <option value="priceDesc">Price: high to low</option>
            <option value="nameAsc">Name A-Z</option>
            <option value="nameDesc">Name Z-A</option>
          </select>
        </div>

        <button class="reset-btn" type="button" (click)="resetFilters()">
          Reset
        </button>
      </div>

      <div class="filter-summary">
        {{ filteredProducts.length }} product(s) found
      </div>
    </div>

    <div
      class="products-grid"
      *ngIf="paginatedProducts.length > 0; else noProducts"
    >
      <div class="product-card" *ngFor="let product of paginatedProducts">
        <img
          [src]="product.images?.length
            ? 'http://localhost:8082/api/uploads/' + product.images[0]
            : 'assets/images/photo-1491295079607-743739e45129.jpeg'"
          [alt]="product.nom"
          class="product-image"
        />

        <h4 class="product-title">{{ product.nom }}</h4>

        <p class="product-description">
          {{ product.description }}
        </p>

        <h5 class="product-price">
          {{ product.prix }} TND
        </h5>

        <button class="view-btn" type="button" (click)="viewMore(product)">
          View More
        </button>
      </div>
    </div>

    <ng-template #noProducts>
      <p class="no-products-message">No products found.</p>
    </ng-template>

    <div class="pagination" *ngIf="totalPages > 1">
      <button
        class="page-btn"
        type="button"
        (click)="previousPage()"
        [disabled]="currentPage === 1"
      >
        Previous
      </button>

      <button
        class="page-btn"
        type="button"
        *ngFor="let page of pages"
        (click)="changePage(page)"
        [class.active]="currentPage === page"
      >
        {{ page }}
      </button>

      <button
        class="page-btn"
        type="button"
        (click)="nextPage()"
        [disabled]="currentPage === totalPages"
      >
        Next
      </button>
    </div>
  </div>
</section>
