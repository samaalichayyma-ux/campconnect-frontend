apiVersion: v1
kind: Namespace
metadata:
  name: campconnect
---
apiVersion: v1
kind: Service
metadata:
  name: campconnect-frontend
  namespace: campconnect
  labels:
    app: campconnect-frontend
spec:
  type: ClusterIP
  selector:
    app: campconnect-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: campconnect-frontend-nodeport
  namespace: campconnect
  labels:
    app: campconnect-frontend
    exposure: nodeport
spec:
  type: NodePort
  selector:
    app: campconnect-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campconnect-frontend
  namespace: campconnect
  labels:
    app: campconnect-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campconnect-frontend
  template:
    metadata:
      labels:
        app: campconnect-frontend
    spec:
      containers:
        - name: frontend
          image: ihebboughanmi/campconnect-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
